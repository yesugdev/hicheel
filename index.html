
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YesBook</title>

    <style>
      
/* =========================
   1. GLOBAL RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    font-size: 16px;
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
    color: #333;
}

/* =========================
   2. MAIN CONTAINER
========================= */

.container {
    background: white;
    width: 100%;
    max-width: 700px;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

/* =========================
   3. HEADINGS
========================= */

h1, h2, h3, h4, h5 {
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 15px;
    overflow-wrap: break-word;
}

h1 {
    color: #e63946;
    font-size: clamp(2rem, 5vw, 2.5rem);
}

h2 {
    color: #e879a9;
    font-size: clamp(1.6rem, 4vw, 2rem);
}

h3 {
    color: #e0a800;
    font-size: clamp(1.3rem, 3vw, 1.625rem);
}

h4 {
    color: #667eea;
    font-size: clamp(1.1rem, 2.5vw, 1.375rem);
}

h5 {
    color: #764ba2;
    font-size: clamp(1rem, 2vw, 1.125rem);
}

/* =========================
   4. PRE
========================= */

pre {
    background: #f4f6fb;
    color: #344054;
    padding: 20px;
    border-left: 5px solid #667eea;
    border-radius: 10px;
    margin: 25px 0;
    overflow-x: auto;
    max-width: 100%;
    white-space: pre;
    font-family: monospace;
    font-size: 14px;
    line-height: 1.7;
}

/* =========================
   5. LINKS
========================= */

a {
    display: inline-block;
    color: #667eea;
    text-decoration: none;
    font-weight: bold;
    margin-bottom: 20px;
    transition: 0.3s;
}

a:hover {
    color: #764ba2;
    text-decoration: underline;
}

/* =========================
   6. BUTTONS
========================= */

button {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    max-width: 100%;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(102,126,234,0.4);
}

button:active {
    transform: scale(0.97);
}

/* Keyboard accessibility */
button:focus-visible,
a:focus-visible {
    outline: 3px solid #f59e0b;
    outline-offset: 4px;
}

/* =========================
   7. TABLET
   768px - 1023px
========================= */

@media (max-width: 1023px) {
    body {
        padding: 24px;
    }

    .container {
        max-width: 650px;
        padding: 32px;
    }
}

/* =========================
   8. MOBILE
   481px - 767px
========================= */

@media (max-width: 767px) {
    body {
        padding: 20px;
        align-items: flex-start;
    }

    .container {
        padding: 28px;
        border-radius: 16px;
    }

    pre {
        padding: 15px;
        font-size: 13px;
        margin: 20px 0;
    }

    button {
        padding: 13px 22px;
    }
}

/* =========================
   9. SMALL MOBILE
   320px - 480px
========================= */

@media (max-width: 480px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 20px;
        border-radius: 12px;
    }

    h1, h2, h3, h4, h5 {
        margin-bottom: 12px;
    }

    pre {
        padding: 12px;
        font-size: 12px;
        border-left-width: 3px;
    }

    a {
        font-size: 14px;
    }

    button {
        width: 100%;
        padding: 14px;
        font-size: 15px;
    }
}

/* =========================
   10. EXTRA SMALL MOBILE
   Below 320px
========================= */

@media (max-width: 319px) {
    body {
        padding: 6px;
    }

    .container {
        padding: 14px;
    }

    h1 {
        font-size: 26px;
    }

    h2 {
        font-size: 22px;
    }

    pre {
        font-size: 11px;
    }

    button {
        font-size: 13px;
        padding: 12px 8px;
    }
}

/* =========================
   11. LARGE DESKTOP
   1440px+
========================= */

@media (min-width: 1440px) {
    .container {
        max-width: 800px;
        padding: 50px;
    }
}

/* =========================
   12. LANDSCAPE MOBILE
========================= */

@media (max-height: 500px) and (orientation: landscape) {
    body {
        align-items: flex-start;
    }

    .container {
        margin: 10px auto;
    }
}

/* =========================
   13. REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
    }
}

    </style>
</head>

</body>
</html>
